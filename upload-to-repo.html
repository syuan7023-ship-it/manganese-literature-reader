<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>上传并更新至仓库</title><style>
body{margin:0;background:#edf3f0;color:#17212b;font-family:Microsoft YaHei,PingFang SC,Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:22px}.hero,.card{background:#fff;border:1px solid #d6e0dc;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 10px 28px rgba(15,23,42,.05)}h1{margin:0 0 8px;font-size:24px}h2{font-size:17px;margin:0 0 10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:block;font-size:12px;font-weight:900;color:#344054;margin:10px 0 5px}input,textarea{width:100%;box-sizing:border-box;border:1px solid #d6e0dc;border-radius:8px;padding:9px;font-family:inherit}textarea{min-height:230px;font-family:Consolas,Microsoft YaHei,monospace;font-size:12px}.row{display:flex;gap:8px;flex-wrap:wrap}.btn{height:36px;border-radius:8px;border:1px solid #d6e0dc;background:#fff;color:#344054;padding:0 12px;font-weight:900;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}.primary{background:#2f6f5e;border-color:#1f5a4b;color:#fff}.danger{background:#fee4e2;border-color:#fda29b;color:#b42318}.note{font-size:12px;color:#667085;line-height:1.7}.warn{background:#fff3d6;border:1px solid #eccb84;color:#6b4b14;border-radius:10px;padding:10px;font-size:12px;line-height:1.7}.log{background:#101828;color:#e4e7ec;border-radius:12px;padding:12px;min-height:180px;max-height:360px;overflow:auto;white-space:pre-wrap;font:12px/1.6 Consolas,monospace}.ok{color:#087443;font-weight:900}@media(max-width:850px){.grid{grid-template-columns:1fr}}
</style></head><body><div class="wrap"><div class="hero"><h1>上传并更新至 GitHub 仓库</h1><p class="note">把 GPT 生成的英文 PDF、中文 PDF、JSON 上传到 manganese-literature-reader，并自动更新 data/library.json。Token 只保存在你当前浏览器本机。</p></div>
<div class="grid"><section class="card"><h2>1. GitHub 设置</h2><label>Repository</label><input id="repo" value="syuan7023-ship-it/manganese-literature-reader"><label>Branch</label><input id="branch" value="main"><label>Personal Access Token</label><input id="token" type="password" placeholder="fine-grained token，Contents: Read and write"><div class="row" style="margin-top:10px"><button class="btn primary" id="save">保存本机</button><button class="btn danger" id="clear">清除</button><button class="btn" id="test">测试</button></div></section>
<section class="card"><h2>2. 路径</h2><label>paper-id</label><input id="pid" placeholder="paper-id"><label>英文 PDF</label><input id="enPath" placeholder="papers/<paper-id>-en.pdf"><label>中文 PDF</label><input id="cnPath" placeholder="papers/<paper-id>-cn.pdf"><label>JSON</label><input id="jsonPath" placeholder="data/<paper-id>.json"><button class="btn" id="autoPath" style="margin-top:10px">自动填路径</button></section></div>
<section class="card"><h2>3. 文件</h2><div class="grid"><div><label>英文原文 PDF</label><input id="enFile" type="file" accept="application/pdf"><p id="enInfo" class="note"></p></div><div><label>中文译文 PDF</label><input id="cnFile" type="file" accept="application/pdf"><p id="cnInfo" class="note"></p></div></div><label>网站 JSON 文件</label><input id="jsonFile" type="file" accept="application/json,.json"><label>或粘贴 JSON</label><textarea id="jsonText"></textarea><div class="row" style="margin-top:10px"><button class="btn" id="readJson">读取 JSON 信息</button><button class="btn" id="fmtJson">格式化 JSON</button></div></section>
<section class="card"><h2>4. 上传</h2><div class="warn">会写入所选 PDF、data/&lt;paper-id&gt;.json，并自动更新 data/library.json。没选择的 PDF 会跳过，不会删除仓库原文件。</div><div class="row" style="margin-top:12px"><button class="btn primary" id="upload">上传并更新至仓库</button><button class="btn" id="libOnly">只更新 library.json</button><a class="btn" href="./">返回网站首页</a></div></section>
<section class="card"><h2>日志</h2><div id="log" class="log">等待操作...</div></section></div>
<script>
'use strict';const $=id=>document.getElementById(id);let enFile=null,cnFile=null,jsonObj=null;function log(s){let e=$('log');e.textContent+='\n['+new Date().toLocaleTimeString()+'] '+s;e.scrollTop=e.scrollHeight}function setlog(s){$('log').textContent=s}function slug(s){return String(s||'paper').toLowerCase().replace(/https?:\/\//g,'').replace(/doi\.org\//g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,80)||'paper'}function b64Text(s){let u=new TextEncoder().encode(s),b='';for(let i=0;i<u.length;i+=32768)b+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return btoa(b)}function textB64(s){let bin=atob(String(s).replace(/\n/g,'')),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new TextDecoder().decode(u)}async function b64File(f){let u=new Uint8Array(await f.arrayBuffer()),b='';for(let i=0;i<u.length;i+=32768)b+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return btoa(b)}function cfg(){let repo=$('repo').value.trim(),branch=$('branch').value.trim()||'main',token=$('token').value.trim();if(!repo.includes('/'))throw Error('Repository 应为 owner/repo');if(!token)throw Error('缺少 token');return{repo,branch,token}}function headers(t){return{Accept:'application/vnd.github+json',Authorization:'Bearer '+t,'X-GitHub-Api-Version':'2022-11-28'}}async function ghGet(path){let c=cfg(),url='https://api.github.com/repos/'+c.repo+'/contents/'+encodeURIComponent(path).replace(/%2F/g,'/')+'?ref='+encodeURIComponent(c.branch),r=await fetch(url,{headers:headers(c.token)});if(r.status===404)return null;if(!r.ok)throw Error('读取 '+path+' 失败: '+r.status+' '+await r.text());return await r.json()}async function ghPut(path,content,msg){let c=cfg(),old=await ghGet(path),body={message:msg,content:content,branch:c.branch};if(old&&old.sha)body.sha=old.sha;let url='https://api.github.com/repos/'+c.repo+'/contents/'+encodeURIComponent(path).replace(/%2F/g,'/'),r=await fetch(url,{method:'PUT',headers:{...headers(c.token),'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok)throw Error('写入 '+path+' 失败: '+r.status+' '+await r.text());return await r.json()}function parseJson(){let t=$('jsonText').value.trim();if(!t)throw Error('请先选择或粘贴 JSON');jsonObj=JSON.parse(t);return jsonObj}function autoPath(){let o=jsonObj||{};let id=slug($('pid').value||o.remoteId||o.id||o.doi||o.title||o.titleCn);$('pid').value=id;$('enPath').value='papers/'+id+'-en.pdf';$('cnPath').value='papers/'+id+'-cn.pdf';$('jsonPath').value='data/'+id+'.json'}function applyJson(o){let id=slug(o.remoteId||o.id||o.doi||o.title||o.titleCn);$('pid').value=id;o.id=o.id||id;o.remoteId=o.remoteId||id;o.assets=o.assets||{};$('enPath').value=o.assets.sourcePath||'papers/'+id+'-en.pdf';$('cnPath').value=o.assets.translationPath||'papers/'+id+'-cn.pdf';$('jsonPath').value=o.assets.jsonPath||'data/'+id+'.json'}function slim(o){let id=o.remoteId||o.id||slug(o.doi||o.title||o.titleCn),a=o.assets||{};return{id:o.id||id,remoteId:id,title:o.title||'',titleCn:o.titleCn||'',journal:o.journal||'',year:o.year||'',doi:o.doi||'',journalRank:o.journalRank||{IF:'-',CAS:'-',JCR:'-'},tags:Array.isArray(o.tags)?o.tags:[],pageCount:o.pageCount||Object.keys(o.pageTranslations||{}).length||0,assets:{sourcePath:a.sourcePath||$('enPath').value,translationPath:a.translationPath||$('cnPath').value,jsonPath:a.jsonPath||$('jsonPath').value}}}async function updateLib(o){log('读取 data/library.json');let lib={version:1,docs:[]},old=await ghGet('data/library.json');if(old&&old.content){lib=JSON.parse(textB64(old.content));if(Array.isArray(lib))lib={version:1,docs:lib}}let d=slim(o),docs=Array.isArray(lib.docs)?lib.docs:[],hit=false;for(let i=0;i<docs.length;i++){if(docs[i].id===d.id||docs[i].remoteId===d.remoteId){docs[i]=d;hit=true;break}}if(!hit)docs.unshift(d);lib.docs=docs;lib.updatedAt=new Date().toISOString();await ghPut('data/library.json',b64Text(JSON.stringify(lib,null,2)),'Update literature library: '+d.remoteId);log('已更新 data/library.json')}async function upload(){try{setlog('开始上传...');let o=parseJson();applyJson(o);o.assets.sourcePath=$('enPath').value.trim();o.assets.translationPath=$('cnPath').value.trim();o.assets.jsonPath=$('jsonPath').value.trim();o.updatedAt=new Date().toISOString();if(enFile){log('上传英文 PDF');await ghPut(o.assets.sourcePath,await b64File(enFile),'Upload source PDF: '+o.remoteId)}else log('未选择英文 PDF，跳过');if(cnFile){log('上传中文 PDF');await ghPut(o.assets.translationPath,await b64File(cnFile),'Upload translation PDF: '+o.remoteId)}else log('未选择中文 PDF，跳过');log('上传 JSON');await ghPut(o.assets.jsonPath,b64Text(JSON.stringify(o,null,2)),'Upload literature JSON: '+o.remoteId);await updateLib(o);log('完成。回首页后点“同步设置 -> 从仓库拉取文献库”。')}catch(e){log('错误：'+(e.message||e))}}$('save').onclick=()=>{localStorage.setItem('repoUpload.repo',$('repo').value);localStorage.setItem('repoUpload.branch',$('branch').value);localStorage.setItem('repoUpload.token',$('token').value);log('已保存到本机浏览器')};$('clear').onclick=()=>{localStorage.removeItem('repoUpload.token');$('token').value='';log('已清除 token')};$('test').onclick=async()=>{try{setlog('测试权限...');await ghGet('data/library.json');log('读取成功，token 可用')}catch(e){log('测试失败：'+(e.message||e))}};$('autoPath').onclick=autoPath;$('readJson').onclick=()=>{try{let o=parseJson();applyJson(o);log('JSON 读取成功：'+(o.titleCn||o.title||o.id||''))}catch(e){log('JSON 错误：'+e.message)}};$('fmtJson').onclick=()=>{try{let o=parseJson();applyJson(o);$('jsonText').value=JSON.stringify(o,null,2);log('已格式化 JSON')}catch(e){log('JSON 错误：'+e.message)}};$('upload').onclick=upload;$('libOnly').onclick=async()=>{try{setlog('开始更新 library.json...');let o=parseJson();applyJson(o);await updateLib(o);log('完成')}catch(e){log('错误：'+(e.message||e))}};$('enFile').onchange=e=>{enFile=e.target.files[0]||null;$('enInfo').innerHTML=enFile?'<span class="ok">已选：</span>'+enFile.name:''};$('cnFile').onchange=e=>{cnFile=e.target.files[0]||null;$('cnInfo').innerHTML=cnFile?'<span class="ok">已选：</span>'+cnFile.name:''};$('jsonFile').onchange=async e=>{let f=e.target.files[0];if(!f)return;$('jsonText').value=await f.text();try{let o=parseJson();applyJson(o);log('已读取 JSON 文件：'+f.name)}catch(err){log('JSON 文件错误：'+err.message)}};window.onload=()=>{$('repo').value=localStorage.getItem('repoUpload.repo')||$('repo').value;$('branch').value=localStorage.getItem('repoUpload.branch')||$('branch').value;$('token').value=localStorage.getItem('repoUpload.token')||'';autoPath()};
</script></body></html>
