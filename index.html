<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>低品位锰矿文献工作台</title>
<style>
:root{--bg:#edf3f0;--ink:#17212b;--text:#344054;--muted:#667085;--line:#d6e0dc;--green:#2f6f5e;--green2:#1f5a4b;--soft:#e8f1ed;--red:#b42318;--redsoft:#fee4e2;--amber:#b87916;--ambersoft:#fff3d6;--blue:#155eef;--bluesoft:#eaf1ff;--side:292px}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(circle at 20% 0,#f8fbf9 0,#edf3f0 36%,#e6eeea 100%);color:var(--ink);font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif}button,input,select,textarea{font-family:inherit}.app{height:100vh;display:grid;grid-template-columns:var(--side) 1fr;overflow:hidden}.side{background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden;box-shadow:6px 0 20px rgba(15,23,42,.04)}.brand{height:58px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px;padding:0 10px}.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#2f6f5e,#48a68d);color:#fff;display:grid;place-items:center;font-weight:900}.bt{font-weight:900;font-size:15px}.bs{font-size:12px;color:var(--muted)}.nav{display:grid;gap:6px;padding:10px;border-bottom:1px solid var(--line)}.nav button{height:38px;border:1px solid transparent;border-radius:10px;background:#fff;color:var(--text);text-align:left;padding:0 10px;font-weight:800;cursor:pointer}.nav button.on{background:var(--soft);border-color:#bdd4ca;color:var(--green2)}.sideBody{padding:10px;overflow:auto}.main{height:100vh;min-width:0}.top{height:56px;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;padding:0 10px;box-shadow:0 8px 22px rgba(15,23,42,.04);z-index:5}.top select,.top input{height:34px;border:1px solid var(--line);border-radius:9px;background:#fff;padding:0 8px}.paperSel{width:360px;max-width:34vw}.pageInp{width:60px;text-align:center}.spacer{flex:1}.btn,.primary,.secondary,.danger{height:34px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--text);font-weight:900;padding:0 11px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.primary{background:#2f6f5e;border-color:#1f5a4b;color:#fff}.danger{background:var(--redsoft);border-color:#fda29b;color:var(--red)}.on{background:var(--soft)!important;border-color:#bdd4ca!important;color:var(--green2)!important}.view{display:none;height:calc(100vh - 56px);overflow:auto;padding:18px}.view.onv{display:block}.head{max-width:1180px;margin:0 auto 14px;display:flex;justify-content:space-between;align-items:flex-end;gap:10px}.head h2{margin:0 0 6px;font-size:24px}.head p{margin:0;color:var(--muted);font-size:13px;line-height:1.7}.grid{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.wide{grid-column:1/-1}.card,.box{background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:14px;padding:15px;box-shadow:0 10px 28px rgba(15,23,42,.04)}.doc h3{margin:0 0 8px;font-size:16px;line-height:1.45}.cn{font-size:13px;color:#344054;line-height:1.6}.meta{font-size:12px;color:var(--muted);line-height:1.6}.tag,.rankTag,.warnTag{display:inline-flex;border:1px solid #bdd4ca;border-radius:999px;background:var(--soft);color:var(--green2);padding:3px 8px;font-size:11px;font-weight:900;margin:5px 5px 0 0}.rankTag{border-color:#eccb84;background:var(--ambersoft);color:#6b4b14}.warnTag{border-color:#b7ccff;background:var(--bluesoft);color:#194185}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.uploadGrid{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.drop{background:#fff;border:1px dashed #9eb8ae;border-radius:14px;padding:15px;min-height:250px}.drop h3{margin:0 0 10px;font-size:18px}.field{margin:8px 0}.field label,label{display:block;font-size:12px;font-weight:900;color:#344054;margin:8px 0 5px}.field input,input,textarea{width:100%;border:1px solid var(--line);border-radius:9px;background:#fff;padding:9px}textarea{min-height:250px;resize:vertical;font:12px/1.5 Consolas,"Microsoft YaHei",monospace}.note{font-size:12px;color:var(--muted);line-height:1.7}.warn{background:var(--ambersoft);border:1px solid #eccb84;color:#6b4b14;border-radius:10px;padding:10px;font-size:12px;line-height:1.7}.log{background:#101828;color:#e4e7ec;border-radius:12px;padding:12px;min-height:150px;max-height:360px;overflow:auto;white-space:pre-wrap;font:12px/1.6 Consolas,monospace}.reader{height:100%;overflow:auto;background:#e6eeea;padding-bottom:64px}.pageRow{min-height:100vh;display:grid;grid-template-columns:50% 2px 1fr;border-bottom:2px solid #cbd6d1}.divider{background:#cbd6d1}.paper{background:#fff;border:1px solid #cfd6d2;min-width:0;min-height:100vh;position:relative;overflow:auto}.pdfBox{min-height:100vh;display:grid;place-items:start center;padding:18px}.pdfBox canvas{max-width:100%;height:auto;box-shadow:0 6px 18px rgba(15,23,42,.12)}.trans{padding:34px 38px 44px;width:100%;min-height:100vh}.trans p,.trans li{line-height:1.9;text-align:justify;color:#263238;overflow-wrap:anywhere}.fig{background:var(--ambersoft);border-left:3px solid var(--amber);padding:8px 10px;margin:12px 0}.pageNo{position:absolute;bottom:16px;left:0;right:0;text-align:center;color:#98a2b3;font-size:11px}.mock,.emptyPdf{min-height:100vh;display:grid;place-items:center;text-align:center;color:var(--muted);padding:34px}.aiGrid{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.aiCard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}.aiCard h3{margin:0 0 8px;font-size:15px}.aiCard p,.aiCard li{font-size:13px;line-height:1.75;color:#344054}.two{grid-column:span 2}.evidence li{margin-bottom:8px}.pageBadge{display:inline-flex;min-width:36px;height:22px;align-items:center;justify-content:center;border-radius:999px;background:var(--soft);color:var(--green2);font-size:11px;font-weight:900;margin-right:6px}.toast{position:fixed;right:18px;bottom:18px;background:#193f35;color:#fff;padding:10px 12px;border-radius:9px;display:none;z-index:40}.small{font-size:12px;color:var(--muted)}@media(max-width:1000px){.app{grid-template-columns:1fr}.side{display:none}.grid,.uploadGrid,.aiGrid{grid-template-columns:1fr}.two{grid-column:1/-1}.paperSel{width:180px}.pageRow{grid-template-columns:1fr}.divider{display:none}}
</style>
</head>
<body>
<div id="app" class="app"><aside class="side"><div class="brand"><div class="logo">Mn</div><div><div class="bt">低品位锰矿文献工作台</div><div class="bs">文献阅读 · 翻译 · 精读</div></div></div><nav class="nav"><button class="on" data-view="library">▦ 文献库</button><button data-view="upload">⇧ 上传/导入</button><button data-view="reader">◫ 对照阅读</button><button data-view="ai">◎ 精读结果</button><button data-view="sync">↻ 同步设置</button></nav><div class="sideBody" id="sideDoc"></div></aside><main class="main"><div class="top"><select id="paperSel" class="paperSel"></select><span class="note">页</span><input id="pageInp" class="pageInp" value="1"><span class="note">/ <span id="pageTotal">1</span></span><button class="btn" id="jumpBtn">跳转</button><button class="btn on" id="modeJson">JSON译文</button><button class="btn" id="modePdf">中文PDF</button><button class="btn" id="reloadFullBtn">刷新全文JSON</button><div class="spacer"></div><input id="searchInp" style="width:180px" placeholder="搜索译文"></div>
<section id="view-library" class="view onv"><div class="head"><div><h2>文献库</h2><p>从仓库拉取或本地导入后显示。卡片会显示影响因子、CAS/JCR 分区和主题标签。</p></div><button class="primary" data-go="upload">新增/上传</button></div><div id="libraryGrid" class="grid"></div></section>
<section id="view-upload" class="view"><div class="head"><div><h2>上传 / 导入</h2><p>导入 AI 精读 JSON，或绑定仓库中的英文/中文 PDF 路径。</p></div></div><div class="uploadGrid"><div class="drop"><h3>英文原文 PDF</h3><input id="sourcePdfInput" type="file" accept="application/pdf"><div class="field"><label>仓库相对路径</label><input id="sourcePathInput"></div><button class="secondary" id="loadSourceRemoteBtn">从仓库读取英文 PDF</button><div id="sourcePdfStatus" class="note"></div></div><div class="drop"><h3>中文翻译 PDF</h3><input id="translationPdfInput" type="file" accept="application/pdf"><div class="field"><label>仓库相对路径</label><input id="translationPathInput"></div><button class="secondary" id="loadTranslationRemoteBtn">从仓库读取中文 PDF</button><div id="translationPdfStatus" class="note"></div></div><div class="drop"><h3>AI 精读 JSON</h3><input id="jsonFileInput" type="file" accept="application/json,.json"><div class="field"><label>仓库相对路径</label><input id="jsonPathInput"></div><button class="secondary" id="loadJsonRemoteBtn">从仓库读取 JSON</button><textarea id="jsonInput"></textarea><div class="row"><button class="primary" id="importJsonBtn">导入 / 更新 JSON</button><button class="secondary" id="fillJsonBtn">用当前文献填充</button></div><div id="jsonStatus" class="note"></div></div></div><div class="grid" style="margin-top:14px"><div class="box wide"><h3>当前文献</h3><div id="importPreview" class="note">暂无</div></div></div></section>
<section id="view-reader" class="view"><div id="reader" class="reader"><div id="readerInner"></div></div></section>
<section id="view-ai" class="view"><div class="head"><div><h2>AI 精读结果</h2><p>研究问题、可靠性、局限、矛盾、迁移应用。兼容英文键名和中文键名，英文依据不再显示 [object Object]。</p></div></div><div id="aiGrid" class="aiGrid"></div></section>
<section id="view-sync" class="view"><div class="head"><div><h2>同步设置</h2><p>拉取仓库 data/library.json，并可批量拉取每篇全文 JSON。</p></div></div><div class="grid"><div class="box wide"><div class="row"><button class="primary" id="pullRepoBtn">从仓库拉取文献库</button><button class="secondary" id="prefetchJsonBtn">批量拉取全文 JSON</button><button class="secondary" id="checkRepoBtn">检查仓库文件状态</button></div><div id="syncStatusTable" style="margin-top:12px"></div></div><div class="box wide"><div id="syncLog" class="log">等待操作...</div></div></div></section>
</main></div><div id="toast" class="toast"></div>
<script>
'use strict';
const DOCS='mn-reader-docs-main-1', CUR='mn-reader-current-main-1';
let docs=loadDocs(), currentId=localStorage.getItem(CUR)||(docs[0]&&docs[0].id)||'', rightMode='json', sourcePdf=null, translationPdf=null, pdfjsLib=null, pdfCache={}, rendered=new Set();
const $=id=>document.getElementById(id);
function esc(v){return String(v==null?'':v).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;')}
function list(v){if(v==null||v==='')return[]; if(Array.isArray(v))return v; return [v]}
function msg(t){$('toast').textContent=t;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2400)}
function loadDocs(){for(const k of [DOCS,'mn-reader-stable-docs-5','mn-reader-stable-docs-4','mn-lit-docs-v16']){try{let d=JSON.parse(localStorage.getItem(k)||'[]');if(Array.isArray(d)&&d.length)return d.map(normalizeDoc)}catch(e){}}return[]}
function saveDocs(){docs=docs.map(normalizeDoc);localStorage.setItem(DOCS,JSON.stringify(docs));if(currentId)localStorage.setItem(CUR,currentId)}
function cur(){return docs.find(d=>d.id===currentId)||docs[0]||null}
function slug(s){return String(s||'paper').toLowerCase().replace(/https?:\/\//g,'').replace(/doi\.org\//g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,80)||'paper'}
function pageCount(d){return Math.max(Number(d&&d.pageCount)||0,Object.keys(toPageMap(d&&d.pageTranslations)).length,1)}
function newDoc(){let id='doc-'+Date.now();return normalizeDoc({id,remoteId:'paper-'+Date.now(),title:'未命名文献',titleCn:'新文献',journal:'',year:'',doi:'',journalRank:{IF:'未标注',CAS:'未标注',JCR:'未标注'},tags:[],pageCount:1,assets:{},pageTranslations:{},pageFigures:{},pageKeyPoints:{},originalEvidence:{},aiReading:{}})}
function ensureDoc(){let d=cur();if(d)return d;d=newDoc();docs.unshift(d);currentId=d.id;saveDocs();return d}
function paths(d){let id=d.remoteId||slug(d.doi||d.title||d.titleCn||d.id);d.remoteId=id;d.assets=d.assets||{};d.assets.sourcePath=d.assets.sourcePath||('papers/'+id+'-en.pdf');d.assets.translationPath=d.assets.translationPath||('papers/'+id+'-cn.pdf');d.assets.jsonPath=d.assets.jsonPath||('data/'+id+'.json');return d.assets}
function normalizeDoc(d){d=d||{};let n={assets:{},pageTranslations:{},pageFigures:{},pageKeyPoints:{},originalEvidence:{},aiReading:{},...d};n.id=n.id||n.remoteId||slug(n.doi||n.title||n.titleCn||Date.now());n.remoteId=n.remoteId||n.id;n.tags=list(n.tags||n.keywords).flat().filter(Boolean);n.journalRank=n.journalRank||n.rank||{};n.pageTranslations=n.pageTranslations||n.translations||n.pages||{};n.pageFigures=n.pageFigures||n.figures||{};n.pageKeyPoints=n.pageKeyPoints||n.keyPointsByPage||n.pageKeypoints||{};n.originalEvidence=n.originalEvidence||n.evidence||{};n.aiReading=n.aiReading||n.reading||n.analysis||{};paths(n);return n}
function mergeDoc(t,input){let d=normalizeDoc(JSON.parse(JSON.stringify(input||{})));let oldAssets=t.assets||{}, newAssets=d.assets||{};Object.assign(t,d,{id:t.id||d.id,assets:{...newAssets,...oldAssets}});if(d.id&&!t.id)t.id=d.id;t.remoteId=d.remoteId||t.remoteId||slug(d.doi||d.title||d.titleCn);paths(t);return normalizeDoc(t)}
function meaningful(v){return v!=null&&v!==''&&v!=='-'&&String(v).toLowerCase()!=='undefined'}
function rankEntries(d){let r=d.journalRank||{}, out=[];if(typeof r==='string'){if(meaningful(r))out.push(['期刊等级',r]);out.push(['IF','未标注'],['CAS','未标注'],['JCR','未标注']);return out}let get=(keys)=>{for(const k of keys){if(meaningful(r[k]))return r[k]}return ''};out.push(['IF',get(['IF','if','impactFactor','impact_factor','影响因子'])||'未标注']);out.push(['CAS',get(['CAS','cas','casQuartile','cas_quartile','中科院'])||'未标注']);out.push(['JCR',get(['JCR','jcr','jcrQuartile','jcr_quartile','jcrQ','分区'])||'未标注']);for(const [k,v] of Object.entries(r)){if(!['IF','if','impactFactor','impact_factor','影响因子','CAS','cas','casQuartile','cas_quartile','中科院','JCR','jcr','jcrQuartile','jcr_quartile','jcrQ','分区'].includes(k)&&meaningful(v))out.push([k,v])}return out}
function rankTags(d){return rankEntries(d).map(([k,v])=>'<span class="rankTag">'+esc(k)+': '+esc(v)+'</span>').join('')}
function card(d,mode){d=normalizeDoc(d);let a=d.assets||{};let tags=list(d.tags).map(t=>'<span class="tag">'+esc(t)+'</span>').join('');let topic=list(d.researchTopicTags).slice(0,5).map(t=>'<span class="warnTag">'+esc(t)+'</span>').join('');return '<div class="card doc"><h3>'+esc(d.title||'未命名文献')+'</h3><div class="cn">'+esc(d.titleCn||'暂无中文标题')+'</div><div class="meta">期刊：'+esc(d.journal||'-')+' ｜ 年份：'+esc(d.year||'-')+' ｜ DOI：'+esc(d.doi||'-')+'<br>英文PDF：'+esc(a.sourceName||a.sourcePath||'未上传')+'<br>中文PDF：'+esc(a.translationName||a.translationPath||'未上传')+'</div><div>'+rankTags(d)+tags+topic+'</div><div class="row" style="margin-top:10px"><button class="primary" data-open="'+esc(d.id)+'">打开阅读</button><button class="secondary" data-ai="'+esc(d.id)+'">AI精读</button>'+(mode==='full'?'<button class="secondary" data-edit="'+esc(d.id)+'">编辑/上传</button><button class="danger" data-del="'+esc(d.id)+'">删除</button>':'')+'</div></div>'}
function renderLibrary(){let d=cur();$('sideDoc').innerHTML=d?card(d,'compact'):'<div class="card">暂无当前文献</div>';$('libraryGrid').innerHTML=docs.length?docs.map(x=>'<div class="box wide">'+card(x,'full')+'</div>').join(''):'<div class="box wide">暂无文献。请到“同步设置”拉取仓库，或到“上传/导入”导入 JSON。</div>';$('paperSel').innerHTML=docs.length?docs.map(x=>'<option value="'+esc(x.id)+'">'+esc(x.titleCn||x.title||'未命名')+'</option>').join(''):'<option>暂无文献</option>';if(currentId)$('paperSel').value=currentId;document.querySelectorAll('[data-open]').forEach(b=>b.onclick=async()=>{currentId=b.dataset.open;saveDocs();await ensureFullDoc(cur(),false);renderAll();show('reader');renderReader()});document.querySelectorAll('[data-ai]').forEach(b=>b.onclick=async()=>{currentId=b.dataset.ai;saveDocs();await ensureFullDoc(cur(),false);renderAll();show('ai')});document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{currentId=b.dataset.edit;saveDocs();renderAll();fillJson();show('upload')});document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{let id=b.dataset.del;docs=docs.filter(x=>x.id!==id);currentId=docs[0]?docs[0].id:'';saveDocs();renderAll()})}
function renderPaths(){let d=cur();if(!d)return;paths(d);$('sourcePathInput').value=d.assets.sourcePath||'';$('translationPathInput').value=d.assets.translationPath||'';$('jsonPathInput').value=d.assets.jsonPath||'';$('currentDocLabel')&&($('currentDocLabel').textContent=d.titleCn||d.title||'未命名')}
function preview(){let d=cur();$('importPreview').innerHTML=d?'<b>英文题名：</b>'+esc(d.title||'-')+'<br><b>中文题名：</b>'+esc(d.titleCn||'-')+'<br><b>期刊/年份：</b>'+esc(d.journal||'-')+' / '+esc(d.year||'-')+'<br><b>DOI：</b>'+esc(d.doi||'-')+'<br><b>等级标签：</b>'+rankTags(d)+'<br><b>JSON译文页数：</b>'+pageCount(d)+'<br><b>英文PDF：</b>'+esc((d.assets&&(d.assets.sourceName||d.assets.sourcePath))||'未绑定')+'<br><b>中文PDF：</b>'+esc((d.assets&&(d.assets.translationName||d.assets.translationPath))||'未绑定'):'暂无'}
function show(name){document.querySelectorAll('.view').forEach(v=>v.classList.remove('onv'));$('view-'+name).classList.add('onv');document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.view===name));if(name==='reader')renderReader();if(name==='ai')ensureFullDoc(cur(),false).then(()=>{renderAll()})}
function toPageMap(v,field){let o={};if(!v)return o;if(Array.isArray(v)){v.forEach((it,i)=>{let p=it&&typeof it==='object'&&it.page?String(it.page):String(i+1);let val=field&&it&&typeof it==='object'?it[field]:(it&&typeof it==='object'&&(it.translation||it.cn||it.text||it.paragraphs||it.keyPoints||it.figures||it.sentences||it.evidence))||it;o[p]=list(val).flat()});return o}if(typeof v==='object'){Object.keys(v).forEach(k=>{let it=v[k];let val=field&&it&&typeof it==='object'?it[field]:(it&&typeof it==='object'&&(it.translation||it.cn||it.text||it.paragraphs||it.keyPoints||it.figures||it.sentences||it.evidence))||it;o[String(k)]=list(val).flat()});return o}return {'1':[v]}}
function flattenText(v){let out=[];function walk(x,p){if(x==null||x==='')return;if(typeof x==='string'||typeof x==='number'){out.push({page:p,text:String(x)});return}if(Array.isArray(x)){x.forEach(y=>walk(y,p));return}if(typeof x==='object'){let page=x.page||x.p||p;let val=x.sentences||x.sentence||x.evidence||x.text||x.original||x.quote||x.keyPoints||x.points;if(val)walk(val,page);else Object.keys(x).forEach(k=>walk(x[k],page||k))}}walk(v,'');return out.filter(e=>e.text)}
function renderValue(v,empty){let items=flattenText(v).map(x=>x.text);if(!items.length)return '<p>'+esc(empty||'暂无。')+'</p>';return '<ul>'+items.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>'}
function renderEvidence(v,limit){let items=flattenText(v).slice(0,limit||30);if(!items.length)return '<p>暂无英文依据。</p>';return '<ul class="evidence">'+items.map(x=>'<li>'+(x.page?'<span class="pageBadge">p.'+esc(x.page)+'</span>':'')+esc(x.text)+'</li>').join('')+'</ul>'}
function pick(obj,keys,fb){obj=obj||{};for(const k of keys){if(obj[k]!=null&&obj[k]!==''&&!(Array.isArray(obj[k])&&!obj[k].length))return obj[k]}return fb||''}
function aiData(d){let ai=d.aiReading||{}, ca=ai.criticalAppraisal||ai.critical||ai.appraisal||{};return {ai,ca}}
function renderAi(){let d=cur();if(!d){$('aiGrid').innerHTML='<div class="aiCard wide">暂无精读结果</div>';return}let {ai,ca}=aiData(d);let ss=ai.structuredSummary||{};let summary=ai.summary||ai.oneSentenceTakeaway||ss.problem||ss.mainResults||'';let research=pick(ca,['研究问题','researchQuestion','question'])||ss.problem;let contribution=pick(ca,['核心贡献','contribution','innovation','innovations']);let conclusions=pick(ca,['主要结论','keyFindings','findings','conclusion','conclusions'])||ss.mainResults;let methods=pick(ca,['方法','methods','method','experimentalDesign'])||ss.method;let reliability=pick(ca,['结论可靠性','reliability','validity']);let sample=pick(ca,['样本量','sampleSize']);let repeat=pick(ca,['重复实验','replicates','repeatExperiments']);let err=pick(ca,['误差线','errorBars']);let stat=pick(ca,['统计方法','statistics','statisticalMethods']);let control=pick(ca,['对照实验','controls','controlExperiments']);let design=pick(ca,['实验设计是否支持结论','designSupportsConclusion','experimentalDesignSupportsConclusion']);let limits=pick(ca,['研究局限','limitations','studyLimitations']);let contradictions=pick(ca,['与同领域研究是否有矛盾','contradictions','conflictsWithField']);let reasons=pick(ca,['矛盾可能原因','possibleReasons','conflictReasons']);let transfer=pick(ca,['能否迁移到用户低品位锰矿问题','transferability','applicability','useForMyProblem'],ai.relevance);let inspiration=pick(ca,['对用户研究路线的启发','routeInspiration','implicationsForUserRoute']);let next=pick(ca,['下一步验证实验','nextExperiments','followUp']);let risks=pick(ca,['用于MnSO4路线的风险点','risksForMnSO4Route']);let mech=ss.mechanism||'';let evidence=d.originalEvidence||{};$('aiGrid').innerHTML='<div class="aiCard wide"><h3>'+esc(d.titleCn||d.title||'当前文献')+'</h3><p>'+esc(summary||'暂无摘要。')+'</p></div><div class="aiCard two"><h3>研究问题与贡献</h3><p><b>问题：</b>'+esc(research||'暂无')+'</p><p><b>贡献：</b></p>'+renderValue(contribution,'暂无贡献。')+'</div><div class="aiCard"><h3>核心结论</h3>'+renderValue(conclusions,'暂无。')+'</div><div class="aiCard"><h3>方法与设计</h3>'+renderValue(methods,'暂无。')+(mech?'<p><b>机理：</b>'+esc(mech)+'</p>':'')+'</div><div class="aiCard"><h3>结论可靠吗？</h3><p><b>样本量：</b>'+esc(sample||'未报告')+'</p><p><b>重复实验：</b>'+esc(repeat||'未报告')+'</p><p><b>误差线：</b>'+esc(err||'未报告')+'</p><p><b>统计：</b>'+esc(stat||'未报告')+'</p>'+renderValue(reliability,'暂无可靠性评价。')+'</div><div class="aiCard"><h3>对照与设计支撑</h3><p><b>对照：</b>'+esc(control||'未报告')+'</p><p><b>设计是否支持结论：</b>'+esc(design||'暂无')+'</p></div><div class="aiCard"><h3>局限</h3>'+renderValue(limits,'暂无。')+'</div><div class="aiCard"><h3>矛盾与原因</h3>'+renderValue(contradictions,'未发现明显矛盾。')+'<p><b>可能原因：</b>'+esc(reasons||'暂无原因分析。')+'</p></div><div class="aiCard two"><h3>迁移到我的问题</h3>'+renderValue(transfer,'暂无。')+'<h3>对我的研究路线启发</h3>'+renderValue(inspiration,'暂无。')+'</div><div class="aiCard"><h3>下一步验证</h3>'+renderValue(next,'暂无。')+'</div><div class="aiCard"><h3>MnSO4 路线风险点</h3>'+renderValue(risks,'暂无。')+'</div><div class="aiCard wide"><h3>英文依据</h3>'+renderEvidence(evidence,40)+'</div>'}
function pageBlock(d,n){let trans=toPageMap(d.pageTranslations)[String(n)]||[];let figs=toPageMap(d.pageFigures)[String(n)]||[];let keys=toPageMap(d.pageKeyPoints,'keyPoints')[String(n)]||[];let ev=toPageMap(d.originalEvidence,'sentences')[String(n)]||[];return '<article class="paper"><div class="trans"><h2>第 '+n+' 页 JSON 译文</h2>'+(trans.length?trans.map(t=>'<p data-cn>'+esc(t)+'</p>').join(''):'<p data-cn>暂无本页中文译文。</p>')+(figs.length?'<div class="fig"><b>图表说明：</b>'+figs.map(esc).join('<br>')+'</div>':'')+(keys.length||ev.length?'<details open><summary>关键点与英文依据</summary><ul>'+keys.map(x=>'<li><b>关键点：</b>'+esc(x)+'</li>').join('')+ev.map(x=>'<li><b>英文依据：</b>'+esc(x)+'</li>').join('')+'</ul></details>':'')+'</div><div class="pageNo">'+n+'</div></article>'}
async function pdfjs(){if(pdfjsLib)return pdfjsLib;pdfjsLib=await import('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs');pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs';return pdfjsLib}
async function loadPdfFromPath(path,type){if(!path)throw Error('路径为空');if(pdfCache[path])return pdfCache[path];let lib=await pdfjs();let data=await (await fetch(path+'?t='+Date.now())).arrayBuffer();let pdf=await lib.getDocument({data}).promise;pdfCache[path]=pdf;if(type==='source')sourcePdf=pdf;else translationPdf=pdf;return pdf}
async function loadPdfFile(file,type){let lib=await pdfjs();let pdf=await lib.getDocument({data:await file.arrayBuffer()}).promise;if(type==='source')sourcePdf=pdf;else translationPdf=pdf;return pdf}
function renderReader(){let d=cur();if(!d){$('readerInner').innerHTML='<div class="mock">暂无文献</div>';return}let total=pageCount(d);if(sourcePdf)total=Math.max(total,sourcePdf.numPages);if(translationPdf)total=Math.max(total,translationPdf.numPages);$('pageTotal').textContent=total;let h='';for(let n=1;n<=total;n++){let left='<article class="paper pdf" data-side="left" data-pdf="source" data-page="'+n+'"><div class="pdfBox"><div class="emptyPdf">'+(sourcePdf?'英文 PDF 第 '+n+' 页渲染中':'未加载英文 PDF')+'</div></div><div class="pageNo">'+n+'</div></article>';let right=rightMode==='pdf'?'<article class="paper pdf" data-side="right" data-pdf="translation" data-page="'+n+'"><div class="pdfBox"><div class="emptyPdf">'+(translationPdf?'中文 PDF 第 '+n+' 页渲染中':'未加载中文 PDF')+'</div></div><div class="pageNo">'+n+'</div></article>':pageBlock(d,n);h+='<div class="pageRow" data-row="'+n+'">'+left+'<div class="divider"></div>'+right+'</div>'}$('readerInner').innerHTML=h;rendered.clear();setTimeout(renderVisible,80)}
async function renderCanvas(pdf,holder,key,n){if(!pdf||rendered.has(key)||n>pdf.numPages)return;rendered.add(key);try{let page=await pdf.getPage(n),box=holder.querySelector('.pdfBox'),vw=Math.max(320,holder.clientWidth-36),vp0=page.getViewport({scale:1}),scale=vw/vp0.width,dev=Math.min(devicePixelRatio||1,2),vp=page.getViewport({scale:scale*dev}),canvas=document.createElement('canvas'),ctx=canvas.getContext('2d',{alpha:false});canvas.width=Math.floor(vp.width);canvas.height=Math.floor(vp.height);canvas.style.width=vw+'px';canvas.style.height=Math.floor(vp0.height*scale)+'px';box.innerHTML='';box.appendChild(canvas);await page.render({canvasContext:ctx,viewport:vp}).promise}catch(e){holder.querySelector('.pdfBox').innerHTML='<div class="emptyPdf">渲染失败：'+esc(e.message)+'</div>'}}
function near(el){let r=el.getBoundingClientRect();return r.bottom>-600&&r.top<innerHeight+900}
function renderVisible(){document.querySelectorAll('[data-pdf]').forEach(h=>{if(!near(h))return;let n=Number(h.dataset.page),pdf=h.dataset.pdf==='source'?sourcePdf:translationPdf;renderCanvas(pdf,h,h.dataset.pdf+'-'+n+'-'+h.clientWidth,n)})}
function renderStatus(){let c=$('syncStatusTable');if(!docs.length){c.innerHTML='<p class="note">暂无文献。</p>';return}c.innerHTML='<table style="width:100%;border-collapse:collapse;font-size:12px"><tr><th align="left">文献</th><th align="left">期刊等级</th><th align="left">JSON</th><th align="left">英文PDF</th><th align="left">中文PDF</th></tr>'+docs.map(d=>{paths(d);return '<tr><td>'+esc(d.titleCn||d.title||d.id)+'</td><td>'+rankTags(d)+'</td><td>'+esc(d.assets.jsonPath||'')+'</td><td>'+esc(d.assets.sourcePath||'')+'</td><td>'+esc(d.assets.translationPath||'')+'</td></tr>'}).join('')+'</table>'}
function renderAll(){renderLibrary();renderPaths();renderAi();renderStatus();preview();$('modePdf').classList.toggle('on',rightMode==='pdf');$('modeJson').classList.toggle('on',rightMode==='json')}
async function fetchRelative(path){let r=await fetch(path+'?t='+Date.now());if(!r.ok)throw Error(path+' HTTP '+r.status);return r}
async function ensureFullDoc(d,force){if(!d)return;paths(d);let hasFull=Object.keys(d.pageTranslations||{}).length||Object.keys(d.aiReading||{}).length;if(hasFull&&!force)return;try{let data=await (await fetchRelative(d.assets.jsonPath)).json();mergeDoc(d,data);saveDocs();msg('已加载全文 JSON：'+d.assets.jsonPath)}catch(e){console.warn(e)}}
async function pullRepo(){try{$('syncLog').textContent='开始拉取 data/library.json...';let lib=await (await fetchRelative('data/library.json')).json();let arr=Array.isArray(lib)?lib:lib.docs;if(!Array.isArray(arr))throw Error('library.json 没有 docs 数组');docs=arr.map(normalizeDoc);currentId=docs[0]?docs[0].id:'';saveDocs();renderAll();$('syncLog').textContent+='\n完成：'+docs.length+' 篇。'}catch(e){$('syncLog').textContent='拉取失败：'+e.message}}
async function prefetchJson(){let log='开始批量拉取全文 JSON...';$('syncLog').textContent=log;for(const d of docs){try{await ensureFullDoc(d,true);log+='\n✓ '+(d.titleCn||d.title||d.id);$('syncLog').textContent=log}catch(e){log+='\n× '+(d.titleCn||d.title||d.id)+'：'+e.message;$('syncLog').textContent=log}}saveDocs();renderAll();msg('批量拉取完成')}
async function checkRepo(){let log='检查仓库文件状态...';for(const d of docs){paths(d);for(const [k,p] of Object.entries({JSON:d.assets.jsonPath,英文PDF:d.assets.sourcePath,中文PDF:d.assets.translationPath})){try{let r=await fetch(p+'?t='+Date.now(),{method:'HEAD'});log+='\n'+(r.ok?'✓':'×')+' '+k+' '+p+' '+r.status}catch(e){log+='\n× '+k+' '+p+' '+e.message}}}$('syncLog').textContent=log}
async function importJsonText(text,label){let data=JSON.parse(text);let d=cur()||ensureDoc();mergeDoc(d,data);currentId=d.id;saveDocs();renderAll();fillJson();$('jsonStatus').textContent=(label||'JSON')+' 已导入。';msg('JSON 已导入')}
function fillJson(){let d=cur();$('jsonInput').value=d?JSON.stringify(d,null,2):''}
function searchCn(q){let term=q.trim();document.querySelectorAll('[data-cn]').forEach(p=>{let raw=p.dataset.raw||p.textContent;p.dataset.raw=raw;if(!term){p.textContent=raw;return}let safe=term.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');p.innerHTML=esc(raw).replace(new RegExp(safe,'gi'),m=>'<span style="background:#ffe08a">'+m+'</span>')})}
function jump(){show('reader');setTimeout(()=>{let row=document.querySelector('[data-row="'+(Number($('pageInp').value)||1)+'"]');if(row)row.scrollIntoView({behavior:'smooth',block:'start'})},80)}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>show(b.dataset.view));document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>show(b.dataset.go));$('paperSel').onchange=async e=>{currentId=e.target.value;saveDocs();await ensureFullDoc(cur(),false);renderAll()};$('jumpBtn').onclick=jump;$('modeJson').onclick=()=>{rightMode='json';renderAll();renderReader()};$('modePdf').onclick=async()=>{let d=cur();try{if(!translationPdf&&d&&d.assets.translationPath)await loadPdfFromPath(d.assets.translationPath,'translation');rightMode='pdf';renderAll();renderReader()}catch(e){msg('中文 PDF 读取失败：'+e.message)}};$('reloadFullBtn').onclick=async()=>{await ensureFullDoc(cur(),true);renderAll()};$('reader').addEventListener('scroll',renderVisible);window.addEventListener('resize',()=>{rendered.clear();renderVisible()});$('pullRepoBtn').onclick=pullRepo;$('prefetchJsonBtn').onclick=prefetchJson;$('checkRepoBtn').onclick=checkRepo;$('importJsonBtn').onclick=()=>importJsonText($('jsonInput').value,'JSON').catch(e=>$('jsonStatus').textContent='JSON 错误：'+e.message);$('fillJsonBtn').onclick=fillJson;$('jsonFileInput').onchange=async e=>{let f=e.target.files[0];if(f)await importJsonText(await f.text(),'JSON 文件 '+f.name)};$('loadJsonRemoteBtn').onclick=async()=>{try{let data=await (await fetchRelative($('jsonPathInput').value.trim())).json();$('jsonInput').value=JSON.stringify(data,null,2);await importJsonText($('jsonInput').value,'仓库 JSON')}catch(e){$('jsonStatus').textContent='读取失败：'+e.message}};$('sourcePathInput').oninput=e=>{let d=ensureDoc();d.assets.sourcePath=e.target.value;saveDocs();renderAll()};$('translationPathInput').oninput=e=>{let d=ensureDoc();d.assets.translationPath=e.target.value;saveDocs();renderAll()};$('jsonPathInput').oninput=e=>{let d=ensureDoc();d.assets.jsonPath=e.target.value;saveDocs();renderAll()};$('loadSourceRemoteBtn').onclick=async()=>{try{$('sourcePdfStatus').textContent='读取中...';sourcePdf=await loadPdfFromPath($('sourcePathInput').value.trim(),'source');$('sourcePdfStatus').textContent='已读取英文 PDF，共 '+sourcePdf.numPages+' 页';renderReader()}catch(e){$('sourcePdfStatus').textContent='读取失败：'+e.message}};$('loadTranslationRemoteBtn').onclick=async()=>{try{$('translationPdfStatus').textContent='读取中...';translationPdf=await loadPdfFromPath($('translationPathInput').value.trim(),'translation');$('translationPdfStatus').textContent='已读取中文 PDF，共 '+translationPdf.numPages+' 页';rightMode='pdf';renderAll();renderReader()}catch(e){$('translationPdfStatus').textContent='读取失败：'+e.message}};$('sourcePdfInput').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{sourcePdf=await loadPdfFile(f,'source');let d=ensureDoc();d.assets.sourceName=f.name;d.pageCount=Math.max(d.pageCount||0,sourcePdf.numPages);saveDocs();$('sourcePdfStatus').textContent='已载入英文 PDF：'+f.name;renderAll();renderReader()}catch(err){$('sourcePdfStatus').textContent='PDF 读取失败：'+err.message}};$('translationPdfInput').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{translationPdf=await loadPdfFile(f,'translation');let d=ensureDoc();d.assets.translationName=f.name;d.pageCount=Math.max(d.pageCount||0,translationPdf.numPages);rightMode='pdf';saveDocs();$('translationPdfStatus').textContent='已载入中文 PDF：'+f.name;renderAll();renderReader()}catch(err){$('translationPdfStatus').textContent='PDF 读取失败：'+err.message}};$('searchInp').oninput=e=>searchCn(e.target.value);
if(!docs.length){pullRepo()}else{renderAll();ensureFullDoc(cur(),false).then(renderAll)}
</script>
