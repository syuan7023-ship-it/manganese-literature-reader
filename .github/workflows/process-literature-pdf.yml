name: Process literature PDF

on:
  push:
    paths:
      - 'incoming/**/*.pdf'
  workflow_dispatch:
    inputs:
      pdf_path:
        description: 'PDF path, for example incoming/my-paper.pdf'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: process-literature-pdf
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve PDF path
        id: pdf
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PDF_PATH="${{ inputs.pdf_path }}"
          else
            PDF_PATH=$(git diff-tree --no-commit-id --name-only -r "${{ github.sha }}" | grep '^incoming/.*\.pdf$' | head -n 1 || true)
          fi
          if [ -z "$PDF_PATH" ]; then
            echo "No incoming PDF found."
            exit 0
          fi
          if [ ! -f "$PDF_PATH" ]; then
            echo "PDF not found: $PDF_PATH"
            exit 1
          fi
          echo "pdf_path=$PDF_PATH" >> "$GITHUB_OUTPUT"
          echo "Processing $PDF_PATH"

      - name: Stop if OpenAI key is missing
        if: steps.pdf.outputs.pdf_path != '' && env.OPENAI_API_KEY == ''
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          echo "OPENAI_API_KEY secret is not configured."
          echo "Add it in Settings > Secrets and variables > Actions > New repository secret."
          exit 1

      - name: Set up Python
        if: steps.pdf.outputs.pdf_path != ''
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.pdf.outputs.pdf_path != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install --upgrade pip
          pip install pymupdf reportlab openai

      - name: Generate translation PDF and JSON
        if: steps.pdf.outputs.pdf_path != ''
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.5' }}
        run: |
          python tools/process_pdf.py "${{ steps.pdf.outputs.pdf_path }}"

      - name: Commit generated files
        if: steps.pdf.outputs.pdf_path != ''
        run: |
          if git diff --quiet -- papers data; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add papers data
          git commit -m "Process literature PDF: ${{ steps.pdf.outputs.pdf_path }}"
          git push
