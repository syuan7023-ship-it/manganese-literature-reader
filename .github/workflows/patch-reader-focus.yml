name: Patch Reader Width Controls

on:
  push:
    paths:
      - .github/workflows/patch-reader-focus.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          if 'let widthAdjustingUntil = 0;' not in s:
              s = s.replace(
                  '    let remoteStatusCache = {};\n',
                  '    let remoteStatusCache = {};\n    let widthAdjustingUntil = 0;\n    let readerWheelBound = false;\n    let focusMode = localStorage.getItem("mn-lit-focus-mode-v3") || "hover";\n    let keyboardFocusSide = null;\n'
              )
          if 'let readerWheelBound = false;' not in s:
              s = s.replace('    let widthAdjustingUntil = 0;\n', '    let widthAdjustingUntil = 0;\n    let readerWheelBound = false;\n')
          if 'let focusMode = localStorage.getItem("mn-lit-focus-mode-v3") || "hover";' not in s:
              s = s.replace('    let readerWheelBound = false;\n', '    let readerWheelBound = false;\n    let focusMode = localStorage.getItem("mn-lit-focus-mode-v3") || "hover";\n    let keyboardFocusSide = null;\n')

          old_calc = '''    function calculateEffectiveWidth() {
      if (!hoverFocus || !hoverSide) {
        return baseLeftWidth;
      }

      if (hoverSide === "left") {
        return Math.max(baseLeftWidth, 80);
      }

      if (hoverSide === "right") {
        return Math.min(baseLeftWidth, 20);
      }

      return baseLeftWidth;
    }
'''
          new_calc = '''    function calculateEffectiveWidth() {
      const focusSide = focusMode === "key" ? keyboardFocusSide : hoverSide;

      if (Date.now() < widthAdjustingUntil) {
        return baseLeftWidth;
      }

      if (!hoverFocus || !focusSide) {
        return baseLeftWidth;
      }

      if (focusSide === "left") {
        return Math.max(baseLeftWidth, 80);
      }

      if (focusSide === "right") {
        return Math.min(baseLeftWidth, 20);
      }

      return baseLeftWidth;
    }
'''
          if old_calc in s:
              s = s.replace(old_calc, new_calc)

          # Make JSON translation stay inside its page instead of overflowing horizontally.
          old_json_width = '''      const scaledWidth = Math.max(100, Math.round(rightZoom * 100));
      const fontSize = Math.max(11, Math.round(13 * rightZoom));

      return `
        <article class="paper-page translation-page reader-pane" data-side="right" data-page-no="${pageNo}">
          <div class="page-scroll">
            <div class="translation-content" style="width:${scaledWidth}%;font-size:${fontSize}px;">
'''
          new_json_width = '''      const fontSize = Math.max(11, Math.round(13 * rightZoom));

      return `
        <article class="paper-page translation-page reader-pane" data-side="right" data-page-no="${pageNo}">
          <div class="page-scroll">
            <div class="translation-content" style="width:100%;font-size:${fontSize}px;">
'''
          if old_json_width in s:
              s = s.replace(old_json_width, new_json_width)

          s = s.replace(
              '''      document.querySelectorAll(".translation-content").forEach((el) => {
        el.style.width = `${Math.max(100, Math.round(rightZoom * 100))}%`;
        el.style.fontSize = `${Math.max(11, Math.round(13 * rightZoom))}px`;
      });
''',
              '''      document.querySelectorAll(".translation-content").forEach((el) => {
        el.style.width = "100%";
        el.style.fontSize = `${Math.max(11, Math.round(13 * rightZoom))}px`;
      });
'''
          )

          old_wheel = '''    function handleReaderWheel(event) {
      if (!els.app.classList.contains("reading")) return;

      if (event.altKey) {
        event.preventDefault();

        const side = getSideFromEvent(event);
        const direction = event.deltaY < 0 ? 2 : -2;

        if (side === "right") {
          baseLeftWidth -= direction;
        } else {
          baseLeftWidth += direction;
        }

        baseLeftWidth = Math.max(20, Math.min(80, baseLeftWidth));
        applyView(false);
        return;
      }

      if (event.ctrlKey || event.metaKey) {
        event.preventDefault();

        const side = getSideFromEvent(event);
        const direction = event.deltaY < 0 ? 0.08 : -0.08;

        if (side === "right") {
          rightZoom = Math.max(0.8, Math.min(2.4, rightZoom + direction));
        } else {
          leftZoom = Math.max(0.8, Math.min(2.4, leftZoom + direction));
        }

        applyView(true);
      }
    }
'''
          new_wheel = '''    function handleReaderWheel(event) {
      if (!els.app.classList.contains("reading")) return;
      if (!event.target.closest("#reader")) return;

      if (event.altKey) {
        event.preventDefault();
        event.stopPropagation();

        const side = getSideFromEvent(event);
        const direction = event.deltaY < 0 ? 2 : -2;

        if (side === "right") {
          baseLeftWidth -= direction;
        } else {
          baseLeftWidth += direction;
        }

        baseLeftWidth = Math.max(20, Math.min(80, baseLeftWidth));
        hoverSide = null;
        keyboardFocusSide = null;
        widthAdjustingUntil = Date.now() + 900;
        applyView(false);
        rendered.clear();
        setTimeout(renderVisiblePdfPages, 80);
        return;
      }

      if (event.ctrlKey || event.metaKey) {
        event.preventDefault();
        event.stopPropagation();

        const side = getSideFromEvent(event);
        const direction = event.deltaY < 0 ? 0.08 : -0.08;

        if (side === "right") {
          rightZoom = Math.max(0.8, Math.min(2.4, rightZoom + direction));
        } else {
          leftZoom = Math.max(0.8, Math.min(2.4, leftZoom + direction));
        }

        applyView(true);
      }
    }
'''
          if old_wheel in s:
              s = s.replace(old_wheel, new_wheel)

          # Ensure wheel listener captures events from page-scroll/canvas, not just reader background.
          s = s.replace(
              '      els.reader.onwheel = handleReaderWheel;\n      els.reader.onscroll = renderVisiblePdfPages;\n',
              '      if (!readerWheelBound) {\n        els.reader.addEventListener("wheel", handleReaderWheel, { passive: false, capture: true });\n        readerWheelBound = true;\n      }\n      els.reader.onscroll = renderVisiblePdfPages;\n'
          )

          # Hover focus only applies in hover mode.
          s = s.replace(
              '''      els.reader.onmousemove = (event) => {
        const pane = event.target.closest("[data-side]");

        if (pane) {
          const nextSide = pane.dataset.side;

          if (nextSide !== hoverSide) {
            hoverSide = nextSide;
            updateEffectiveWidth();
            rendered.clear();
            setTimeout(renderVisiblePdfPages, 100);
          }
        }
      };
''',
              '''      els.reader.onmousemove = (event) => {
        if (focusMode !== "hover") return;
        const pane = event.target.closest("[data-side]");

        if (pane) {
          const nextSide = pane.dataset.side;

          if (nextSide !== hoverSide) {
            hoverSide = nextSide;
            updateEffectiveWidth();
            rendered.clear();
            setTimeout(renderVisiblePdfPages, 100);
          }
        }
      };
'''
          )

          # Persist focus mode.
          s = s.replace(
              '      localStorage.setItem("mn-lit-hover-focus-v2", hoverFocus ? "on" : "off");\n',
              '      localStorage.setItem("mn-lit-hover-focus-v2", hoverFocus ? "on" : "off");\n      localStorage.setItem("mn-lit-focus-mode-v3", focusMode);\n'
          )

          # Add keyboard shortcut handler once after bindEvents function starts if not present.
          if 'function bindKeyboardShortcuts()' not in s:
              marker = '    function bindEvents() {\n'
              insert = '''    function bindKeyboardShortcuts() {
      document.addEventListener("keydown", (event) => {
        if (!els.app.classList.contains("reading")) return;
        if (["INPUT", "TEXTAREA", "SELECT"].includes(event.target.tagName)) return;

        if (event.key.toLowerCase() === "f") {
          event.preventDefault();
          focusMode = "key";
          hoverFocus = true;
          const side = hoverSide || keyboardFocusSide || "left";
          keyboardFocusSide = keyboardFocusSide === side ? null : side;
          widthAdjustingUntil = 0;
          applyView(true);
          toast(keyboardFocusSide ? `${keyboardFocusSide === "left" ? "左页" : "右页"}聚焦` : "取消聚焦");
        }

        if (event.key.toLowerCase() === "h") {
          event.preventDefault();
          focusMode = focusMode === "hover" ? "key" : "hover";
          keyboardFocusSide = null;
          hoverSide = null;
          applyView(true);
          toast(focusMode === "hover" ? "悬停聚焦模式" : "快捷键聚焦模式：按 F 聚焦/取消");
        }

        if (event.key.toLowerCase() === "r") {
          event.preventDefault();
          resetViewSettings();
        }
      });
    }

'''
              s = s.replace(marker, insert + marker)
              s = s.replace('      bindSidebarResize();\n    }\n', '      bindSidebarResize();\n      bindKeyboardShortcuts();\n    }\n')

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          if git diff --quiet index.html; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix reader width and focus controls"
          git push
